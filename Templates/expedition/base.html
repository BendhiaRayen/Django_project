<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Expéditions{% endblock %} · FleetFlow</title>
<style>
:root{--ink:#172033;--muted:#667085;--line:#e6eaf0;--brand:#635bff;--brand-dark:#4c46d8;--danger:#c93756;--canvas:#f5f7fb;--shadow:0 18px 45px rgba(23,32,51,.08)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(circle at 92% 0%,#ebeaff 0,transparent 34%),var(--canvas);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}.topbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,5vw,72px);background:rgba(255,255,255,.86);border-bottom:1px solid rgba(230,234,240,.8);backdrop-filter:blur(16px)}.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.03em;font-size:1.08rem}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;color:#fff;background:linear-gradient(135deg,var(--brand),#8a84ff);box-shadow:0 8px 18px rgba(99,91,255,.28)}.topbar-link{color:var(--muted);font-size:.9rem;font-weight:650}.topbar-link:hover{color:var(--brand)}main{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:54px 0 80px}.eyebrow{margin:0 0 9px;color:var(--brand);font-size:.75rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(2rem,4vw,3rem);line-height:1.05;letter-spacing:-.055em}.subtle{color:var(--muted);line-height:1.65}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:22px;margin-bottom:34px}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 17px;border:0;border-radius:12px;color:#fff;background:var(--brand);font:inherit;font-size:.9rem;font-weight:750;cursor:pointer;box-shadow:0 10px 20px rgba(99,91,255,.2)}.button:hover{background:var(--brand-dark);transform:translateY(-1px)}.button.secondary{color:var(--ink);background:#fff;border:1px solid var(--line);box-shadow:none}.button.danger{background:var(--danger)}.card{background:rgba(255,255,255,.94);border:1px solid rgba(230,234,240,.9);border-radius:20px;box-shadow:var(--shadow)}.table-card{overflow:hidden}.table-wrap{overflow-x:auto}.expedition-list{width:100%;border-collapse:collapse;min-width:680px}.expedition-list th{padding:17px 24px;color:#8992a4;background:#fbfcfe;font-size:.72rem;letter-spacing:.1em;text-align:left;text-transform:uppercase}.expedition-list td{padding:21px 24px;border-top:1px solid var(--line);font-size:.92rem}.expedition-list tr:hover td{background:#fcfcff}.reference{color:var(--brand);font-weight:800}.status{display:inline-flex;padding:6px 10px;border-radius:99px;color:#556070;background:#f0f2f6;font-size:.76rem;font-weight:750}.actions{display:flex;justify-content:flex-end;gap:14px;white-space:nowrap}.action-link{color:var(--muted);font-size:.84rem;font-weight:700}.action-link:hover{color:var(--brand)}.action-link.delete:hover{color:var(--danger)}.empty{padding:64px 24px;color:var(--muted);text-align:center}.form-card{max-width:720px;padding:clamp(24px,5vw,42px)}form p{display:flex;flex-direction:column;gap:8px;margin:0 0 21px;color:var(--muted);font-size:.84rem;font-weight:700}form input,form select,form textarea{width:100%;padding:12px 14px;color:var(--ink);background:#fbfcfe;border:1px solid #dfe4ec;border-radius:10px;font:inherit;font-weight:500;outline:none}form textarea{min-height:110px;resize:vertical}form input:focus,form select:focus,form textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(99,91,255,.11)}.form-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}.detail-card{padding:clamp(25px,5vw,42px)}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));margin:28px 0 0;border-top:1px solid var(--line)}.detail-item{padding:19px 18px 19px 0;border-bottom:1px solid var(--line)}.detail-item:nth-child(even){padding-left:18px;border-left:1px solid var(--line)}.detail-label{display:block;margin-bottom:6px;color:#8992a4;font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.detail-value{font-size:1rem;font-weight:650;word-break:break-word}.confirm-card{max-width:580px;padding:42px;text-align:center}.confirm-icon{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 22px;border-radius:18px;color:var(--danger);background:#fff0f3;font-size:1.45rem}.confirm-card .subtle{margin:14px 0 28px}@media(max-width:700px){main{width:min(100% - 28px,1120px);padding-top:34px}.topbar{padding:0 18px}.page-head{align-items:flex-start;flex-direction:column}.page-head .button{width:100%}.detail-grid{grid-template-columns:1fr}.detail-item,.detail-item:nth-child(even){padding-left:0;border-left:0}.confirm-card{padding:30px 22px}}
</style></head><body><header class="topbar"><a class="brand" href="{% url 'Expedition:list_class' %}"><span class="brand-mark">↗</span> FleetFlow</a><a class="topbar-link" href="{% url 'Expedition:list_class' %}">Gestion des expéditions</a></header><main>{% block content %}{% endblock %}</main></body></html>
