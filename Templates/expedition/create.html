{% extends "expedition/base.html" %}{% block title %}Nouvelle expédition{% endblock %}{% block content %}
<p class="eyebrow">Nouvelle opération</p>
<h1>Créer une expédition</h1>
<p class="subtle">
  Ajoutez les informations nécessaires pour organiser votre prochain envoi.
</p>
<section class="card form-card" style="margin-top: 30px">
  <form method="post">
    {% csrf_token %}{{ form.as_p }}
    <div class="form-actions">
      <button class="button" type="submit">Créer l'expédition</button
      ><a class="button secondary" href="{% url 'Expedition:list_class' %}"
        >Annuler</a
      >
    </div>
  </form>
</section>
{% endblock %}
