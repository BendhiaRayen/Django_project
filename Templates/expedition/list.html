<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>List of Expeditions</h1>
    <ul>
    {% for expedition in list %}
        <li>
            <a href="{% url 'Expedition:detail' expedition.references %}">{{ expedition.references }}</a>
            - {{ expedition.entreprise }}
            <a href="{% url 'Expedition:delete' expedition.references %}">Supprimer</a>
        </li>
        {%empty %}
        No expeditions found
    {% endfor %}
    </ul>
</body>
</html>
